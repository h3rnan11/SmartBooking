spring.application.name=SmartBooking
spring.datasource.url=jdbc:mysql://localhost:3306/smartbooking?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Root
server.port=8080
server.servlet.context-path=/smartBooking
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
smartbooking.admin.email=admin@smartbooking.com
smartbooking.admin.password=admin123
