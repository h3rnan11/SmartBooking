<article class="appointment-card">
  <div class="appointment-when">
    <span class="appointment-date">{{ appointment().date }}</span>
    <span class="appointment-time">{{ appointment().startTime }}</span>
  </div>
  <div class="appointment-where">
    <span class="appointment-local">{{ appointment().name }}</span>
    <span class="appointment-location">{{ appointment().location }}</span>
  </div>
</article>
