
<aside class="sidebar-container">

  <!-- 1. LOGO DE LA APP (SUPERIOR) -->
  <div class="sidebar-logo">
    <div class="logo-badge">

    </div>
    <div class="logo-info">
      <h1 class="logo-title">SmartBooking</h1>
      <p class="logo-subtitle">Appointments software</p>
    </div>
  </div>

  <!-- Main Nav -->
  <nav class="nav-section">

    <!-- Profile -->
    <button class="nav-link">
      <a>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16">
          <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0"/>
          <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1"/>
        </svg>
      </a>
      <span>Profile</span> <!--In the future maybe we save pics in the DB -->
    </button>

    <!-- Calendar -->
    <button class="nav-link">
      <a>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-calendar-range" viewBox="0 0 16 16">
          <path d="M9 7a1 1 0 0 1 1-1h5v2h-5a1 1 0 0 1-1-1M1 9h4a1 1 0 0 1 0 2H1z"/>
          <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5M1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4z"/>
        </svg>
      </a>
      <span>Calendar</span>
    </button>
  </nav>

  <div class="sidebar-footer">

    <!-- Settings -->

    <div class="accordion-box">
      <button (click)="toggleHamburger()" class="accordion-header">
        <div class="accordion-header-title">

            </svg>
          </a>
          <span>More...</span>
        </div>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="arrow" [class.open]="isHamburgerOpen()" viewBox="0 0 16 16">
          <path fill-rule="evenodd" d="M1.646 4.646a.5.5 0 0 1 .708 0L8 10.293l5.646-5.647a.5.5 0 0 1 .708.708l-6 6a.5.5 0 0 1-.708 0l-6-6a.5.5 0 0 1 0-.708"/>

      @if (isHamburgerOpen()){
      <div class="submenu-list">
        <button class="sub-link">
          <a>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-gear" viewBox="0 0 16 16">

        </button>

        <button class="sub-link">
          <a>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-graph-up" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M0 0h1v15h15v1H0zm14.817 3.113a.5.5 0 0 1 .07.704l-4.5 5.5a.5.5 0 0 1-.74.037L7.06 6.767l-3.656 5.027a.5.5 0 0 1-.808-.588l4-5.5a.5.5 0 0 1 .758-.06l2.609 2.61 4.15-5.073a.5.5 0 0 1 .704-.07"/>

    <div class="sidebar-divider"></div>

    <a class="nav-link" href="https://github.com/h3rnan11" target="_blank" rel="noopener noreferrer">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">

      </svg>
      <span>h3rnan11</span>

</aside>
